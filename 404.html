<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページが見つかりません｜リピトーク</title>
    <meta name="description" content="お探しのページは移動または削除された可能性があります。リピトーク公式サイトのトップページへお戻りください。">
    <meta name="theme-color" content="#f8f5ed">
    <link rel="icon" href="assets/repitalk_app_icon.png" type="image/png">
    <style>
      :root {
        --ink: #383c34;
        --muted: #696d63;
        --deep-green: #3f5b4d;
        --pale-green: #dfe8dc;
        --cream: #f8f5ed;
        --white: #fffef9;
        --border: #d9d8cc;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 32px 20px;
        place-items: center;
        background: var(--cream);
        color: var(--ink);
        font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.8;
        letter-spacing: 0.035em;
      }

      .error-card {
        width: min(100%, 640px);
        padding: clamp(42px, 8vw, 72px) clamp(24px, 7vw, 64px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--white);
        box-shadow: 0 20px 50px rgba(62, 72, 61, 0.08);
        text-align: center;
      }

      .error-logo {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 28px;
        border-radius: 16px;
        object-fit: contain;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.75rem, 5vw, 2.4rem);
        font-weight: 600;
        line-height: 1.45;
      }

      p {
        margin: 0 auto 32px;
        color: var(--muted);
      }

      .home-link {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        border: 1px solid var(--deep-green);
        border-radius: 999px;
        background: var(--deep-green);
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      .home-link:hover {
        background: #31493d;
      }

      :focus-visible {
        outline: 3px solid #a66b35;
        outline-offset: 4px;
      }

      @media (max-width: 480px) {
        .error-card {
          padding-right: 20px;
          padding-left: 20px;
          border-radius: 22px;
        }

        h1 {
          font-size: 1.55rem;
          letter-spacing: 0.02em;
        }
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <img class="error-logo" src="assets/repitalk_app_icon.png" alt="リピトーク" width="512" height="512">
      <h1>ページが見つかりません</h1>
      <p>お探しのページは移動または削除された可能性があります。</p>
      <a class="home-link" href="https://repitalk.jp/">トップページへ戻る</a>
    </main>
  </body>
</html>
